# docker-compose describes a set of containers that run together and can talk
# to each other by service name. Start everything with: docker compose up
services:
  # ---------- MongoDB (the "M" in MERN) ----------
  mongo:
    image: mongo:7 # pull a prebuilt MongoDB image; no Dockerfile needed
    ports:
      - "27017:27017" # host:container — lets you inspect the DB from your machine
    volumes:
      - mongo-data:/data/db # persist data even if the container is recreated

  # ---------- Express + Socket.IO API (the "E" + "N") ----------
  server:
    build: ./server # build from server/Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - path: ./server/.env # lets docker get passed the .env file values
        required: false
    environment:
      # Inside the compose network, "mongo" resolves to the MongoDB container.
      MONGO_URI: mongodb://mongo:27017/chat
      CLIENT_ORIGIN: http://localhost:5173
      PORT: "3000"
      # Student code runs in the runner service, never in this container.
      # "runner" resolves to the runner container on the compose network.
      RUNNER_URL: http://runner:4000
      # How many programs run at once; must match the runner's, so both read this one value.
      MAX_CONCURRENT_RUNS: ${MAX_CONCURRENT_RUNS:-2}
      RUNNER_TOKEN: ${RUNNER_TOKEN:?Set RUNNER_TOKEN in .env at the repo root (see .env.example)}
    volumes:
      # Mount your source so edits trigger hot reload inside the container.
      # We deliberately DON'T mount node_modules (see the anonymous volume below).
      - ./server/src:/app/src
      - /app/node_modules
    depends_on:
      - mongo # start mongo first
      - runner

  # ---------- Sandbox image for student code ----------
  # Not a long-running service: it's here so "docker compose up --build" builds
  # the littlepointers-sandbox image the runner starts for each run. The
  # container itself exits right away.
  sandbox:
    build:
      context: ./server
      dockerfile: Dockerfile.sandbox
    image: littlepointers-sandbox # the name the runner's SANDBOX_IMAGE refers to
    entrypoint: ["true"]
    restart: "no"

  # ---------- Code runner ----------
  # Starts one locked-down sandbox container per code run (see
  # runner/src/index.ts). It has the Docker socket, which is root on the host,
  # so it has NO "ports:" entry and can't be reached from outside. Every service
  # on the compose network can still reach runner:4000, so RUNNER_TOKEN is what
  # keeps anything but the server from running code through it.
  runner:
    build: ./runner
    environment:
      PORT: "4000"
      SANDBOX_IMAGE: littlepointers-sandbox
      # How many programs run at once. The server gets the same value below.
      MAX_CONCURRENT_RUNS: ${MAX_CONCURRENT_RUNS:-2}
      RUNNER_TOKEN: ${RUNNER_TOKEN:?Set RUNNER_TOKEN in .env at the repo root (see .env.example)}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      sandbox:
        condition: service_completed_successfully # image built before the first run

  # ---------- React + Vite dev server (the "R") ----------
  client:
    build: ./client
    ports:
      - "5173:5173"
    environment:
      # Where the browser should reach the API. The browser runs on your host,
      # so it uses localhost, not the internal "server" hostname.
      VITE_SERVER_URL: http://localhost:3000
    volumes:
      - ./client/src:/app/src
      - /app/node_modules
    depends_on:
      - server

# Named volume that keeps MongoDB data between restarts.
volumes:
  mongo-data:
